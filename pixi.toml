[workspace]
authors = ["84176052+sounddrill31 <84176052+sounddrill31@users.noreply.github.com>"]
channels = ["conda-forge"]
name = "Emscripten Project MATLAB"
platforms = ["linux-64", "win-64"]
version = "0.1.0"

[tasks]
export-web = "emcc input/*.c -msimd128 -msse2 -sALLOW_MEMORY_GROWTH=1 -sINITIAL_MEMORY=33554432 -sEXPORTED_FUNCTIONS=['_genTriangleLogic'] -I ./extern/include -o output/index.html"
server = { cmd="caddy file-server --listen :8080 --root output/", depends-on="export-web" }

[dependencies]
emscripten = ">=4.0.9,<5"
caddy = ">=2.11.4,<3"
